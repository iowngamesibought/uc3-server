[package]
name = "uc3-server"
version = "0.1.0"
edition = "2024"
description = "Community server for the online mode of UC3: live-data HTTP and framed TCP services"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
blowfish = "0.9"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hmac = "0.12"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "signal", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
